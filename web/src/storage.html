<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
    <title>Batman Library</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Dokdo&display=swap" rel="stylesheet">
</head>
<body>
    <h1 style="font-size:50px" class="title"><a href="/index.html">🦇</a> Batman Library<span style="font-size:small"> - storage</span></h1>
    <nav class="menu">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="library.html">Library</a></li>
            <li><a href="community.html">Community</a></li>
            <li><a href = "storage.html">Storage</a></li>
        </ul>
    </nav>
    {% if err_c %}
    <div class="modal-bg" id="errorModal">
        <div class="white-bg">
            <h1>⚠️ 알림</h1>
            <p>이 책은 이미 보관함에 있습니다.</p>
        </div>
    </div>
    {% else %}
    {% endif %}
    {% if sto %}
        {% for i in sto %}
            <div class="box">
                <a href="/pdf/{{i[1]}}.pdf" target="_blank"><button class="view-btn">책 읽기</button></a>
                <p><span style="font-size:30px"><b>{{ i[1] }}</b></span> - ST#10042500{{i[0]}}</p>
                <hr>
                <p>{{i[2]}}</p>
            </div>
        {% endfor %}
    {% else %}
        <h3>보관된 책이 없습니다.</h3>
    {% endif %}
    <script>
        const modal = document.getElementById('errorModal');
        
        if (modal) {
            // 1. 뒷배경 누르면 모달창 안 보이게 하기 (display none)
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });

            // 💡 2. [핵심 버그 해결] 모달이 뜨자마자 브라우저 주소창을 "/storage.html"로 세탁해 버리기
            // 이렇게 하면 새로고침을 해도 에러가 없는 깨끗한 상태로 새로고침 됩니다!
            window.history.replaceState({}, document.title, "/storage.html");
        }
    </script>
</body>
</html>
