<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
    <title>Batman Library</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Dokdo&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <h1 class="title">
                <a href="index.html" class="bat-logo">🦇</a>
                <a href="index.html" class="brand-name">Batman Library</a>
                <span class="page-label">- community</span>
            </h1>

            <nav class="menu">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="library.html">Library</a></li>
                    <li><a href="community.html" class="active">Community</a></li>
                    <li><a href="storage.html">Storage</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <div>
        <form action="contenting" method="get">
            <label for="title">게시물 제목</label>
            <input class="pub" type="text" id="title " name="title" required>
            <br>
            <br>
            <label for="author">닉네임</label>
            <input class="pub" type="text" id="author" name="author" required>
            <br>
            <br>
            <label for="content">내용</label>
            <textarea id="content" name="content" rows="8" cols="61" style="vertical-align: top; resize: none;"required></textarea>
            <br>
            <button class="pub_btn" style="margin-left: 600px;" type="submit">게시물 올리기</button>
        </form>
    </div>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
